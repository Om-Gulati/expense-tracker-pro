openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Expense Tracker Pro API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: expenses
    description: Expense management
  - name: income
    description: Income management
  - name: budgets
    description: Budget management
  - name: goals
    description: Financial goals
  - name: dashboard
    description: Dashboard summaries
  - name: analytics
    description: Analytics and reports
  - name: export
    description: Data export

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /expenses:
    get:
      operationId: getExpenses
      tags: [expenses]
      summary: List expenses
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseListResponse"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /income:
    get:
      operationId: getIncomeList
      tags: [income]
      summary: List income entries
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of income
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeListResponse"
    post:
      operationId: createIncome
      tags: [income]
      summary: Create an income entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"

  /income/{id}:
    put:
      operationId: updateIncome
      tags: [income]
      summary: Update an income entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
    delete:
      operationId: deleteIncome
      tags: [income]
      summary: Delete an income entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /budgets:
    get:
      operationId: getBudgets
      tags: [budgets]
      summary: List budgets
      responses:
        "200":
          description: List of budgets with spending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetWithSpending"
    post:
      operationId: createBudget
      tags: [budgets]
      summary: Create a budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"

  /budgets/{id}:
    put:
      operationId: updateBudget
      tags: [budgets]
      summary: Update a budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
    delete:
      operationId: deleteBudget
      tags: [budgets]
      summary: Delete a budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /goals:
    get:
      operationId: getGoals
      tags: [goals]
      summary: List financial goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a financial goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a financial goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/monthly:
    get:
      operationId: getMonthlyAnalytics
      tags: [analytics]
      summary: Monthly income vs expense chart data
      parameters:
        - name: months
          in: query
          schema:
            type: integer
            default: 6
      responses:
        "200":
          description: Monthly analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyData"

  /analytics/categories:
    get:
      operationId: getCategoryBreakdown
      tags: [analytics]
      summary: Expense breakdown by category
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryData"

  /analytics/trends:
    get:
      operationId: getSpendingTrends
      tags: [analytics]
      summary: Spending trends and habits
      responses:
        "200":
          description: Spending trends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingTrends"

  /reports/monthly:
    get:
      operationId: getMonthlyReport
      tags: [analytics]
      summary: Detailed monthly report
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"

  /export/csv:
    get:
      operationId: exportCsv
      tags: [export]
      summary: Export data as CSV
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [expenses, income, all]
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
      required: [id, name, email, createdAt]

    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        password:
          type: string
          minLength: 6
      required: [name, email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
      required: [email, password]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    Expense:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: number
        category:
          type: string
        note:
          type: ["string", "null"]
        date:
          type: string
        createdAt:
          type: string
      required: [id, userId, amount, category, date, createdAt]

    ExpenseInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        category:
          type: string
        note:
          type: string
        date:
          type: string
      required: [amount, category, date]

    ExpenseUpdate:
      type: object
      properties:
        amount:
          type: number
        category:
          type: string
        note:
          type: string
        date:
          type: string

    ExpenseListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [data, total, page, limit, totalPages]

    Income:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: number
        category:
          type: string
        source:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        date:
          type: string
        createdAt:
          type: string
      required: [id, userId, amount, category, date, createdAt]

    IncomeInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        category:
          type: string
        source:
          type: string
        note:
          type: string
        date:
          type: string
      required: [amount, category, date]

    IncomeUpdate:
      type: object
      properties:
        amount:
          type: number
        category:
          type: string
        source:
          type: string
        note:
          type: string
        date:
          type: string

    IncomeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Income"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [data, total, page, limit, totalPages]

    Budget:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        category:
          type: string
        limitAmount:
          type: number
        month:
          type: integer
        year:
          type: integer
        createdAt:
          type: string
      required: [id, userId, category, limitAmount, month, year, createdAt]

    BudgetWithSpending:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        category:
          type: string
        limitAmount:
          type: number
        month:
          type: integer
        year:
          type: integer
        spent:
          type: number
        remaining:
          type: number
        percentage:
          type: number
        createdAt:
          type: string
      required: [id, userId, category, limitAmount, month, year, spent, remaining, percentage, createdAt]

    BudgetInput:
      type: object
      properties:
        category:
          type: string
        limitAmount:
          type: number
          minimum: 0
        month:
          type: integer
        year:
          type: integer
      required: [category, limitAmount, month, year]

    BudgetUpdate:
      type: object
      properties:
        limitAmount:
          type: number

    Goal:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        targetAmount:
          type: number
        currentAmount:
          type: number
        deadline:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, userId, title, targetAmount, currentAmount, createdAt]

    GoalInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        targetAmount:
          type: number
          minimum: 0
        currentAmount:
          type: number
        deadline:
          type: string
      required: [title, targetAmount]

    GoalUpdate:
      type: object
      properties:
        title:
          type: string
        targetAmount:
          type: number
        currentAmount:
          type: number
        deadline:
          type: string

    DashboardStats:
      type: object
      properties:
        totalBalance:
          type: number
        totalIncome:
          type: number
        totalExpenses:
          type: number
        totalSavings:
          type: number
        monthlyIncome:
          type: number
        monthlyExpenses:
          type: number
        monthlySavings:
          type: number
        healthScore:
          type: number
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        budgetAlerts:
          type: array
          items:
            $ref: "#/components/schemas/BudgetAlert"
      required: [totalBalance, totalIncome, totalExpenses, totalSavings, monthlyIncome, monthlyExpenses, monthlySavings, healthScore, recentTransactions, budgetAlerts]

    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [expense, income]
        amount:
          type: number
        category:
          type: string
        note:
          type: ["string", "null"]
        date:
          type: string
      required: [id, type, amount, category, date]

    BudgetAlert:
      type: object
      properties:
        category:
          type: string
        limitAmount:
          type: number
        spent:
          type: number
        percentage:
          type: number
      required: [category, limitAmount, spent, percentage]

    MonthlyData:
      type: object
      properties:
        month:
          type: string
        income:
          type: number
        expenses:
          type: number
        savings:
          type: number
      required: [month, income, expenses, savings]

    CategoryData:
      type: object
      properties:
        category:
          type: string
        amount:
          type: number
        percentage:
          type: number
        count:
          type: integer
      required: [category, amount, percentage, count]

    SpendingTrends:
      type: object
      properties:
        dailyAverage:
          type: number
        weeklyAverage:
          type: number
        monthlyAverage:
          type: number
        topCategory:
          type: string
        savingsRate:
          type: number
        streak:
          type: integer
      required: [dailyAverage, weeklyAverage, monthlyAverage, topCategory, savingsRate, streak]

    MonthlyReport:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        totalIncome:
          type: number
        totalExpenses:
          type: number
        savings:
          type: number
        savingsRate:
          type: number
        highestExpenseCategory:
          type: string
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryData"
        previousMonthComparison:
          type: object
          properties:
            incomeChange:
              type: number
            expenseChange:
              type: number
            savingsChange:
              type: number
          required: [incomeChange, expenseChange, savingsChange]
        insights:
          type: array
          items:
            type: string
      required: [year, month, totalIncome, totalExpenses, savings, savingsRate, highestExpenseCategory, categoryBreakdown, previousMonthComparison, insights]
